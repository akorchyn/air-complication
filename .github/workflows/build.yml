name: Build Connect IQ

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Application variant (production requires the saved signing key)'
        type: choice
        default: beta
        options:
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.variant || 'beta' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set build paths
        env:
          REQUESTED_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'beta' }}
        run: |
          case "$REQUESTED_VARIANT" in
            beta) artifact_base=air-alert-beta; checksum=SHA256SUMS-beta ;;
            production) artifact_base=air-alert; checksum=SHA256SUMS ;;
            *) echo 'Invalid application variant' >&2; exit 2 ;;
          esac
          echo "BUILD_VARIANT=$REQUESTED_VARIANT" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASE=$artifact_base" >> "$GITHUB_ENV"
          echo "CHECKSUM_NAME=$checksum" >> "$GITHUB_ENV"
          echo "CIQ_SDK=$RUNNER_TEMP/connectiq/sdk" >> "$GITHUB_ENV"
          echo "CIQ_KEY=$RUNNER_TEMP/ciq-developer-key.der" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache verified SDK and supported device definitions
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/connectiq
            ~/.Garmin/ConnectIQ/Devices/epix2
            ~/.Garmin/ConnectIQ/Devices/epix2pro51mm
            ~/.Garmin/ConnectIQ/Devices/venu441mm
            ~/.Garmin/ConnectIQ/Devices/venu445mm
          key: ciq-linux-9.2.0-epix2-pro51-venu4-cd073d7fc408-v3
      - name: Install SDK and device definition
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: scripts/setup-ci-sdk.sh "$RUNNER_TEMP/connectiq"
      - name: Prepare signing key
        env:
          CIQ_SIGNING_KEY_BASE64: ${{ secrets.CIQ_SIGNING_KEY_BASE64 }}
        run: |
          umask 077
          if [[ -n "$CIQ_SIGNING_KEY_BASE64" ]]; then
            printf '%s' "$CIQ_SIGNING_KEY_BASE64" | base64 --decode > "$CIQ_KEY"
            echo 'Using configured developer signing key.'
          else
            if [[ "$BUILD_VARIANT" == production ]]; then
              echo '::error::Production builds require the repository Actions secret CIQ_SIGNING_KEY_BASE64. Configure your permanent developer key first.'
              exit 1
            fi
            openssl genrsa -out "$RUNNER_TEMP/ciq-developer-key.pem" 4096 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER \
              -in "$RUNNER_TEMP/ciq-developer-key.pem" -out "$CIQ_KEY" -nocrypt
            rm "$RUNNER_TEMP/ciq-developer-key.pem"
            echo 'Using an ephemeral development key for this run.'
            echo '::warning::Beta build uses a temporary signing key. Do not upload this package to Garmin if you need to update that listing later; configure CIQ_SIGNING_KEY_BASE64 and rebuild.'
          fi
      - name: Check generated fixtures and location catalog
        run: |
          python3 scripts/generate_tests.py
          python3 scripts/generate_locations.py
          git diff --exit-code -- tests/generated/Fixtures.mc source/LocationCatalog.mc source/LocationPresets.mc resources/locations.xml resources/settings.xml
      - name: Check release tag matches manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os,xml.etree.ElementTree as ET
          app=ET.parse('manifest.xml').getroot().find('{http://www.garmin.com/xml/connectiq}application')
          assert os.environ['GITHUB_REF_NAME']=='v'+app.attrib['version'], 'Tag must match manifest version'
          PY
      - name: Build selected app variant and IQ package
        run: |
          for device in epix2 epix2pro51mm venu441mm venu445mm; do
            scripts/build.sh app "$device" "$BUILD_VARIANT"
          done
          scripts/build.sh package epix2 "$BUILD_VARIANT"
          (cd artifacts && sha256sum --check "$CHECKSUM_NAME")
          {
            echo "## Air Alert UA: $BUILD_VARIANT"
            echo "Package: \`$ARTIFACT_BASE.iq\`"
            if [[ "$BUILD_VARIANT" == beta ]]; then
              echo 'Separate beta app ID; select **Beta App** when uploading to Garmin.'
            else
              echo 'Production app ID; upload without selecting **Beta App**.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile simulator and test targets
        run: |
          for device in epix2 epix2pro51mm venu441mm venu445mm; do
            scripts/build.sh spike "$device"
            scripts/build.sh consumer "$device"
            scripts/build.sh integration "$device"
            scripts/build.sh tests "$device"
          done
      - name: Upload application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Air-Alert-UA-${{ env.BUILD_VARIANT }}-Epix-Gen-2-and-Venu-4
          path: |
            artifacts/${{ env.ARTIFACT_BASE }}.prg
            artifacts/${{ env.ARTIFACT_BASE }}-epix2pro51mm.prg
            artifacts/${{ env.ARTIFACT_BASE }}-venu441mm.prg
            artifacts/${{ env.ARTIFACT_BASE }}-venu445mm.prg
            artifacts/${{ env.ARTIFACT_BASE }}.iq
            artifacts/${{ env.CHECKSUM_NAME }}
          if-no-files-found: error
          retention-days: 90
      - name: Upload simulator fixtures
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-fixtures-do-not-sideload
          path: |
            artifacts/spike*.prg
            artifacts/consumer*.prg
            artifacts/integration*.prg
            artifacts/tests*.prg
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing key
        if: always()
        run: rm -f "$CIQ_KEY" "$RUNNER_TEMP/ciq-developer-key.pem"

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Air-Alert-UA-beta-Epix-Gen-2-and-Venu-4
          path: artifacts
      - name: Publish GitHub Release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS-beta)
          {
            echo '**Beta app build.** Uses a separate application ID and the name Air Alert UA Beta. Select **Beta App** when uploading the IQ package to Garmin. A permanent developer signing key is required for future updates to the same Garmin listing.'
            echo
            echo 'These beta assets do not replace the production application. Production builds are available through Actions → Build Connect IQ → Run workflow → production.'
            echo
            cat docs/RELEASE-NOTES.md
          } > "$RUNNER_TEMP/beta-release-notes.md"
          gh release create "$GITHUB_REF_NAME" \
            artifacts/air-alert-beta.prg artifacts/air-alert-beta-venu441mm.prg \
            artifacts/air-alert-beta-epix2pro51mm.prg \
            artifacts/air-alert-beta-venu445mm.prg artifacts/air-alert-beta.iq artifacts/SHA256SUMS-beta \
            --verify-tag --prerelease --latest=false --title "Air Alert UA $GITHUB_REF_NAME (beta)" \
            --notes-file "$RUNNER_TEMP/beta-release-notes.md"
