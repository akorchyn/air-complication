name: Build Power Schedule UA
on:
  push:
    paths: ['power-schedule/**', '.github/workflows/power-schedule.yml', 'scripts/setup-ci-sdk.sh']
  pull_request:
    paths: ['power-schedule/**', '.github/workflows/power-schedule.yml', 'scripts/setup-ci-sdk.sh']
  workflow_dispatch:
    inputs:
      variant:
        description: Application variant
        type: choice
        default: beta
        options: [beta, production]
permissions:
  contents: read
concurrency:
  group: power-${{ github.ref }}-${{ github.event_name }}-${{ inputs.variant || 'beta' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Adapter tests and fixture consistency
        working-directory: power-schedule
        run: |
          node --test adapter/test/worker.test.mjs
          node scripts/generate-fixtures.mjs
          git diff --exit-code -- tests/generated tests/fixtures
      - name: Set paths and variant
        env:
          VARIANT: ${{ inputs.variant || 'beta' }}
        run: |
          case "$VARIANT" in beta|production) ;; *) exit 2 ;; esac
          echo "BUILD_VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "CIQ_SDK=$RUNNER_TEMP/connectiq/sdk" >> "$GITHUB_ENV"
          echo "CIQ_KEY=$RUNNER_TEMP/power-developer-key.der" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: sdk
        with:
          path: |
            ${{ runner.temp }}/connectiq
            ~/.Garmin/ConnectIQ/Devices/epix2
            ~/.Garmin/ConnectIQ/Devices/epix2pro51mm
            ~/.Garmin/ConnectIQ/Devices/venu441mm
            ~/.Garmin/ConnectIQ/Devices/venu445mm
          key: ciq-linux-9.2.0-epix2-pro51-venu4-cd073d7fc408-v3
      - if: steps.sdk.outputs.cache-hit != 'true'
        run: scripts/setup-ci-sdk.sh "$RUNNER_TEMP/connectiq"
      - name: Signing key
        env:
          CIQ_SIGNING_KEY_BASE64: ${{ secrets.CIQ_SIGNING_KEY_BASE64 }}
        run: |
          umask 077
          if [[ -n "$CIQ_SIGNING_KEY_BASE64" ]]; then
            printf '%s' "$CIQ_SIGNING_KEY_BASE64" | base64 --decode > "$CIQ_KEY"
          else
            if [[ "$BUILD_VARIANT" == production ]]; then
              echo '::error::Production needs CIQ_SIGNING_KEY_BASE64'; exit 1
            fi
            openssl genrsa -out "$RUNNER_TEMP/power-key.pem" 4096 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/power-key.pem" -out "$CIQ_KEY" -nocrypt
            echo '::warning::Temporary beta key; configure the permanent key before a Garmin upload.'
          fi
      - name: Compile all models, tests and fixtures
        working-directory: power-schedule
        run: |
          for device in epix2 epix2pro51mm venu441mm venu445mm; do
            scripts/build.sh app "$device" "$BUILD_VARIANT"
            scripts/build.sh tests "$device"
          done
          scripts/build.sh consumer epix2pro51mm
          scripts/build.sh integration epix2pro51mm
          scripts/build.sh package epix2 "$BUILD_VARIANT"
          (cd artifacts && sha256sum power-schedule*.prg power-schedule*.iq > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Power-Schedule-UA-${{ env.BUILD_VARIANT }}
          path: |
            power-schedule/artifacts/power-schedule*.prg
            power-schedule/artifacts/power-schedule*.iq
            power-schedule/artifacts/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Power-Schedule-UA-adapter
          path: |
            power-schedule/adapter/src
            power-schedule/adapter/wrangler.jsonc
            power-schedule/adapter/package.json
            power-schedule/adapter/package-lock.json
            power-schedule/adapter/README.md
            power-schedule/adapter/THIRD-PARTY-LICENSE.txt
      - name: Remove signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ['power-developer-key.der','power-key.pem']:
              (Path(os.environ['RUNNER_TEMP'])/name).unlink(missing_ok=True)
          PY
